<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ホーム - けんぼう家庭教師予約システム</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 4px 8px; text-align: center; font-size: 13px; }
        .available { background: #dfd; cursor: pointer; }
        .reserved { background: #fcc; }
        .vacation { background: #ccc; }
        .buffer { background: #fec; }
        .msg { padding: 8px; margin: 8px 0; }
        .msg-ok { background: #dfd; }
        .msg-err { background: #fcc; }
    </style>
</head>

<body>
    <h1>けんぼう家庭教師予約システム</h1>
    <p>ようこそ、<span th:text="${loginUser.displayName()}">ユーザー</span> さん
        (<span th:text="${loginUser.role()}">ROLE</span>)</p>
    <nav>
        <a th:href="@{/}">ホーム</a> |
        <a th:href="@{/reservations}">予約管理</a> |
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit">ログアウト</button>
        </form>
    </nav>

    <div th:if="${message}" class="msg msg-ok" th:text="${message}"></div>
    <div th:if="${error}" class="msg msg-err" th:text="${error}"></div>

    <!-- 週ナビゲーション -->
    <div style="margin:16px 0">
        <a th:href="@{/(week=${calendar.weekStart().minusWeeks(1)})}">&laquo; 前週</a>
        &nbsp;
        <span th:text="${calendar.weekStart()} + ' ～ ' + ${calendar.weekStart().plusDays(6)}"></span>
        &nbsp;
        <a th:href="@{/(week=${calendar.weekStart().plusWeeks(1)})}">翌週 &raquo;</a>
        &nbsp;
        <a th:href="@{/}">今週</a>
    </div>

    <!-- 生徒向け: 通知 -->
    <div th:if="${notifications != null && !notifications.isEmpty()}">
        <h2>予約結果通知</h2>
        <table>
            <tr><th>日時</th><th>ステータス</th></tr>
            <tr th:each="n : ${notifications}">
                <td th:text="${n.startAt()} + ' ～ ' + ${n.endAt()}"></td>
                <td th:text="${n.status()}"></td>
            </tr>
        </table>
    </div>

    <!-- 週間カレンダー -->
    <h2>週間スケジュール</h2>
    <table>
        <thead>
            <tr>
                <th>時間</th>
                <th th:each="date : ${calendar.dates()}" th:text="${date}"></th>
            </tr>
        </thead>
        <tbody>
            <!-- 09:00～20:30 の各スロット行 -->
            <tr th:each="slotIdx : ${#numbers.sequence(0, 23)}">
                <td th:with="slotTime=${calendar.slotsByDate().values().iterator().next().get(slotIdx).time()}"
                    th:text="${slotTime}"></td>
                <td th:each="date : ${calendar.dates()}"
                    th:with="slot=${calendar.slotsByDate().get(date).get(slotIdx)}">
                    <!-- AVAILABLE: 生徒なら予約フォーム表示 -->
                    <div th:if="${slot.status().name() == 'AVAILABLE'}" class="available">
                        <form th:if="${loginUser.role().name() == 'STUDENT'}"
                              th:action="@{/reserve}" method="post" style="margin:0">
                            <input type="hidden" name="tutorId" th:value="${tutorId}">
                            <input type="hidden" name="startAt"
                                   th:value="${date.toString() + 'T' + slot.time().toString() + ':00'}">
                            <button type="submit" style="background:none;border:none;cursor:pointer;">○</button>
                        </form>
                        <span th:if="${loginUser.role().name() != 'STUDENT'}">○</span>
                    </div>
                    <div th:if="${slot.status().name() == 'RESERVED'}" class="reserved"
                         th:title="${slot.studentName()}">✕</div>
                    <div th:if="${slot.status().name() == 'VACATION'}" class="vacation">-</div>
                    <div th:if="${slot.status().name() == 'BUFFER'}" class="buffer">✕</div>
                </td>
            </tr>
        </tbody>
    </table>

    <p style="font-size:12px">○=空き ✕=予約済み/バッファ -=休暇</p>

    <!-- 講師向け: 未回答予約 -->
    <div th:if="${pendingList != null && !pendingList.isEmpty()}">
        <h2>未回答予約</h2>
        <table>
            <tr><th>生徒</th><th>日時</th><th>操作</th></tr>
            <tr th:each="p : ${pendingList}">
                <td th:text="${p.userName()}"></td>
                <td th:text="${p.startAt()} + ' ～ ' + ${p.endAt()}"></td>
                <td>
                    <form th:action="@{/approve/{id}(id=${p.id()})}" method="post" style="display:inline">
                        <button type="submit">承認</button>
                    </form>
                    <form th:action="@{/reject/{id}(id=${p.id()})}" method="post" style="display:inline">
                        <button type="submit">却下</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
