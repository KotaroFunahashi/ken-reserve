spring:
  application:
    name: ken-reserve

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ken_reserve}
    username: ${DB_USER:root}
    password: ${DB_PASS:password}
    hikari:
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  data-initializer:
    admin-password: ${ADMIN_INIT_PASSWORD:password}
